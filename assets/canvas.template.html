<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__CANVAS_TITLE__</title>
<style>
  :root {
    --bg: #f4f3f1; --grid: #e3e1dd; --ink: #1c1917; --muted: #78716c;
    --line: #d6d3d1; --panel: #fffefc; --sel: #b45309; --note: #fef3c7; --note-line: #fcd34d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1917; --grid: #292524; --ink: #f5f5f4; --muted: #a8a29e;
      --line: #44403c; --panel: #262322; --sel: #f59e0b; --note: #422006; --note-line: #92400e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #viewport { position: fixed; inset: 0; cursor: grab; overflow: hidden;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

  .board { position: absolute; }
  .board-strip { display: flex; align-items: center; gap: 8px; height: 22px;
    font-size: 12px; color: var(--muted); user-select: none; cursor: default; }
  .board-strip b { font-weight: 500; color: var(--ink); }
  .board-strip .tag { font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; }
  .board-frame { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .04); }
  .board.selected .board-frame { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
  .board.selected .board-strip b { color: var(--sel); }
  .board-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

  .note { position: absolute; background: var(--note); border: 1px solid var(--note-line);
    border-radius: 3px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap;
    box-shadow: 0 2px 6px rgb(0 0 0 / .08); cursor: default; }

  #bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; padding: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 4px 16px rgb(0 0 0 / .1); z-index: 10; }
  #bar button, #bar select { font: inherit; color: var(--ink); background: transparent;
    border: 0; border-radius: 5px; padding: 5px 9px; cursor: pointer; }
  #bar button:hover, #bar select:hover { background: var(--bg); }
  #bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
  #zoom { min-width: 46px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  #title { position: fixed; top: 16px; left: 18px; font-size: 13px; font-weight: 500; z-index: 10;
    padding: 5px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }

  #focus { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; }
  #focus.on { display: block; }
  #focus iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #focus-close { position: fixed; top: 14px; right: 14px; z-index: 21; }

  @media print {
    #bar, #title, #viewport { display: none !important; }
    #print-out { display: block !important; }
  }
  #print-out { display: none; }
  #print-out .p { page-break-after: always; }
  #print-out iframe { border: 0; display: block; }
</style>
</head>
<body>

<div id="title">__CANVAS_TITLE__</div>
<div id="viewport"><div id="world"></div></div>
<div id="focus"><button id="focus-close">Close</button></div>
<div id="print-out"></div>

<div id="bar">
  <select id="pages" hidden></select>
  <span class="sep" id="pages-sep" hidden></span>
  <button id="zoom-out" title="Zoom out">&minus;</button>
  <span id="zoom">100%</span>
  <button id="zoom-in" title="Zoom in">+</button>
  <button id="fit">Fit</button>
  <span class="sep"></span>
  <button id="print">Export PDF</button>
</div>

<script id="canvas-doc" type="application/json">__CANVAS_STATE__</script>

<script>
(() => {
  "use strict";
  const raw = document.getElementById("canvas-doc").textContent;
  const DOC = JSON.parse(raw.replace(/<\\\/script/g, "</script").replace(/<\\!--/g, "<!--"));
  const files = DOC.files || {};
  const manifest = DOC.canvas || {};
  const boards = manifest.artboards || [];
  const notes = manifest.notes || [];
  const pages = manifest.pages || [];

  const IMG = /\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i;
  const MIME = { png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif",
                 webp:"image/webp", avif:"image/avif", bmp:"image/bmp", svg:"image/svg+xml" };

  // Inline every image files-entry into an artboard's source, by bare filename.
  function resolve(src) {
    let out = src;
    for (const [name, data] of Object.entries(files)) {
      if (!IMG.test(name)) continue;
      const ext = name.split(".").pop().toLowerCase();
      const uri = "data:" + (MIME[ext] || "application/octet-stream") + ";base64," + data;
      const esc = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      out = out.replace(new RegExp('src="\\.?/?' + esc + '"', "g"), 'src="' + uri + '"');
      out = out.replace(new RegExp("url\\((['\"]?)\\.?/?" + esc + "\\1\\)", "g"), "url(" + uri + ")");
    }
    return out;
  }

  const world = document.getElementById("world");
  const viewport = document.getElementById("viewport");
  let view = { x: 80, y: 80, k: 1 };
  let page = null;
  let touched = false;   // set once the user pans or zooms; stops auto-refit

  const onPage = (o) => !pages.length || (o.page || pages[0].id) === page;

  function render() {
    world.textContent = "";
    for (const b of boards) {
      if (!onPage(b)) continue;
      const src = files[b.file];
      if (src === undefined) continue;
      const el = document.createElement("div");
      el.className = "board";
      el.style.cssText = `left:${b.x||0}px;top:${b.y||0}px;width:${b.w||800}px`;
      const strip = document.createElement("div");
      strip.className = "board-strip";
      const nm = document.createElement("b");
      nm.textContent = b.title || b.file.replace(/\.html$/i, "");
      strip.append(nm);
      if (b.interactive) { const t = document.createElement("span"); t.className = "tag";
        t.textContent = "interactive"; strip.append(t); }
      const frame = document.createElement("div");
      frame.className = "board-frame";
      frame.style.height = (b.h || 600) + "px";
      const f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-scripts");   // no allow-same-origin: opaque origin
      f.setAttribute("loading", "lazy");
      f.srcdoc = resolve(src);
      frame.append(f);
      el.append(strip, frame);
      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".board-frame")) return;
        document.querySelectorAll(".board.selected").forEach(n => n.classList.remove("selected"));
        el.classList.add("selected"); e.stopPropagation();
      });
      el.addEventListener("dblclick", (e) => {
        if (e.target.closest(".board-frame")) return;
        focusOn(b);
      });
      world.append(el);
    }
    for (const n of notes) {
      if (!onPage(n)) continue;
      const el = document.createElement("div");
      el.className = "note";
      el.style.cssText = `left:${n.x||0}px;top:${n.y||0}px;width:${n.w||220}px`;
      el.textContent = n.text || "";
      world.append(el);
    }
    apply();
  }

  const apply = () => {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
    document.getElementById("zoom").textContent = Math.round(view.k * 100) + "%";
  };

  // ---- pan / zoom -----------------------------------------------------------
  let drag = null;
  viewport.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".board") || e.target.closest(".note")) return;
    document.querySelectorAll(".board.selected").forEach(n => n.classList.remove("selected"));
    touched = true;
    drag = { x: e.clientX - view.x, y: e.clientY - view.y };
    viewport.classList.add("panning");
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove", (e) => {
    if (!drag) return;
    view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply();
  });
  const endPan = () => { drag = null; viewport.classList.remove("panning"); };
  viewport.addEventListener("pointerup", endPan);
  viewport.addEventListener("pointercancel", endPan);

  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    touched = true;
    const f = e.ctrlKey || e.metaKey ? 0.01 : 0.0025;
    const k = Math.min(4, Math.max(0.05, view.k * Math.exp(-e.deltaY * f)));
    view.x = e.clientX - (e.clientX - view.x) * (k / view.k);
    view.y = e.clientY - (e.clientY - view.y) * (k / view.k);
    view.k = k; apply();
  }, { passive: false });

  function bounds() {
    const items = [...boards.filter(onPage).map(b => ({ x: b.x||0, y: (b.y||0) - 26,
                     w: b.w||800, h: (b.h||600) + 26 })),
                   ...notes.filter(onPage).map(n => ({ x: n.x||0, y: n.y||0, w: n.w||220, h: 90 }))];
    if (!items.length) return null;
    return items.reduce((a, i) => ({
      x1: Math.min(a.x1, i.x), y1: Math.min(a.y1, i.y),
      x2: Math.max(a.x2, i.x + i.w), y2: Math.max(a.y2, i.y + i.h)
    }), { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
  }
  function fit() {
    const b = bounds(); if (!b) return;
    const pad = 64, W = innerWidth - pad * 2, H = innerHeight - pad * 2 - 60;
    view.k = Math.min(2, Math.max(0.05, Math.min(W / (b.x2 - b.x1), H / (b.y2 - b.y1))));
    view.x = pad + (W - (b.x2 - b.x1) * view.k) / 2 - b.x1 * view.k;
    view.y = pad + (H - (b.y2 - b.y1) * view.k) / 2 - b.y1 * view.k;
    apply();
  }

  // ---- focus mode -----------------------------------------------------------
  const focusEl = document.getElementById("focus");
  function focusOn(b) {
    focusEl.querySelectorAll("iframe").forEach(n => n.remove());
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts");
    f.srcdoc = resolve(files[b.file]);
    focusEl.append(f); focusEl.classList.add("on");
  }
  document.getElementById("focus-close").onclick = () => focusEl.classList.remove("on");
  addEventListener("keydown", (e) => { if (e.key === "Escape") focusEl.classList.remove("on"); });

  // ---- print / PDF ----------------------------------------------------------
  document.getElementById("print").onclick = () => {
    const out = document.getElementById("print-out");
    out.textContent = "";
    for (const b of boards) {
      if (!onPage(b)) continue;
      const src = files[b.file]; if (src === undefined) continue;
      const wrap = document.createElement("div");
      wrap.className = "p";
      const f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-scripts");
      f.width = b.w || 800; f.height = b.h || 600;
      f.srcdoc = resolve(src);
      wrap.append(f); out.append(wrap);
    }
    setTimeout(() => print(), 400);
  };

  // ---- pages ----------------------------------------------------------------
  const sel = document.getElementById("pages");
  if (pages.length) {
    for (const p of pages) {
      const o = document.createElement("option"); o.value = p.id; o.textContent = p.name;
      sel.append(o);
    }
    sel.hidden = false; document.getElementById("pages-sep").hidden = false;
    sel.onchange = () => { page = sel.value; touched = false; render(); fit(); };
  }

  document.getElementById("zoom-in").onclick = () => { touched = true; view.k = Math.min(4, view.k * 1.25); apply(); };
  document.getElementById("zoom-out").onclick = () => { touched = true; view.k = Math.max(0.05, view.k / 1.25); apply(); };
  document.getElementById("fit").onclick = () => { touched = false; fit(); };

  // Refit while the view is untouched, so a resized window never leaves artboards clipped.
  let rt = null;
  addEventListener("resize", () => {
    if (touched) return;
    clearTimeout(rt);
    rt = setTimeout(fit, 120);
  });

  // ---- boot -----------------------------------------------------------------
  const launch = manifest.launch || { view: "canvas" };
  page = (pages.length ? (launch.page || pages[0].id) : null);
  if (pages.length) sel.value = page;
  render();
  if (launch.view === "focused" && files[launch.file]) {
    focusOn(boards.find(b => b.file === launch.file) || { file: launch.file });
  }
  fit();
})();
</script>
</body>
</html>
