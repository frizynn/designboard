<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>__CANVAS_TITLE__</title>
<style>
  :root{
    --bg:#1b1b1b; --head:#1f1f1f; --panel:#252525; --panel2:#2c2c2c; --field:#2b2b2b; --field2:#353535;
    --line:#3a3a3a; --line2:#2f2f2f; --ink:#ececec; --muted:#9a9a9a; --dim:#6e6e6e;
    --row:#33415c; --accent:#3d7eff; --accent-bg:#1f3157; --note:#fbf3bd; --noteink:#3d3a20;
    --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.23,1,.32,1);
    --t-tap:110ms; --t-hover:130ms; --t-pop:180ms; --side-w:330px; --head-h:52px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);touch-action:none;
    font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input,select{font:inherit;color:inherit;background:none;border:0;outline:0;min-width:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
  .f:focus-within{border-color:var(--accent)}
  kbd{font:inherit;color:var(--dim);margin-left:auto;padding-left:18px}

  #app{position:relative;height:100%;overflow:hidden}
  #head{position:absolute;top:0;left:0;right:0;height:var(--head-h);display:flex;align-items:center;
    gap:8px;padding:0 12px 0 10px;background:var(--head);border-bottom:1px solid var(--line2);z-index:8}
  #head .sp{flex:1}
  #doc-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;
    font-size:15px;color:var(--ink);max-width:50vw}
  #doc-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #doc-btn svg{color:var(--muted);flex:none}
  #t-save{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 14px;border-radius:8px;
    background:var(--ink);color:#151515;font-weight:500;
    transition:background var(--t-hover) var(--ease),transform var(--t-tap) var(--ease-out)}
  #t-save:active{transform:scale(.97)}
  #t-save .cv{color:#555}
  #t-save:disabled{opacity:.6}

  #stage{position:absolute;top:var(--head-h);left:0;right:0;bottom:0;overflow:hidden}
  /* The viewport is a real scroller: two-finger pan is the browser's own threaded scrolling. */
  #viewport{position:absolute;inset:0;overflow:scroll;overscroll-behavior:none;overflow-anchor:none;scrollbar-width:none;
    cursor:default}
  #viewport::-webkit-scrollbar{display:none}
  #space{position:relative}
  #viewport.panning,#viewport.hand.panning{cursor:grabbing}
  #viewport.hand{cursor:grab}
  #viewport.pen{cursor:crosshair}
  #viewport.noting{cursor:copy}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;--k:1;--inv:1}
  #ink{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  #deny{position:fixed;z-index:7;pointer-events:none;opacity:0;display:grid;place-items:center;
    border:1.5px dashed var(--dim);background:rgb(255 255 255/.05);color:var(--dim);
    font-size:12px;border-radius:6px;transition:opacity 90ms linear}

  /* floating pills, top-left tools and top-right view controls */
  .pill{position:absolute;top:12px;z-index:6;display:flex;align-items:center;gap:2px;padding:5px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 24px rgb(0 0 0/.35)}
  .pill .sep{width:1px;height:20px;background:var(--line);margin:0 5px}
  .pill button{height:32px;min-width:32px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;gap:4px;color:var(--muted);position:relative;
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  .pill button:active{transform:scale(.94)}
  .pill button.on{background:var(--accent-bg);color:#8fb4ff}
  .pill button.txt{padding:0 9px;color:var(--ink);font-size:14px}
  .pill button .cv{color:var(--dim)}
  #toolbar{left:12px}
  #hud{right:12px;transition:transform 260ms var(--ease-out)}
  body.side #hud{transform:translateX(calc(-1 * var(--side-w)))}
  #zoom-btn{min-width:72px!important;font-variant-numeric:tabular-nums}

  /* tooltips: label plus key, delayed so they never flicker while moving across a toolbar */
  [data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;
    transform:translateX(-50%) translateY(-2px);white-space:nowrap;pointer-events:none;opacity:0;
    padding:4px 8px;border-radius:6px;background:#111;border:1px solid var(--line);color:var(--ink);
    font-size:12px;transition:opacity var(--t-hover) var(--ease),transform var(--t-hover) var(--ease);
    z-index:20}

  /* menus */
  .menu{position:fixed;z-index:50;min-width:220px;max-width:340px;padding:6px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgb(0 0 0/.5);
    transform-origin:top left;animation:pop var(--t-pop) var(--ease-out)}
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(-3px)}}
  .menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:7px;
    color:var(--ink);text-align:left;font-size:13.5px;white-space:nowrap}
  .menu .mi:disabled{color:var(--dim);cursor:default}
  .menu .mi .ck{width:14px;flex:none;color:var(--accent);display:grid;place-items:center}
  .menu .mi .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
  .menu .mi .more{color:var(--dim);padding:0 4px;border-radius:5px;margin-right:-4px}
  .menu .mh{padding:8px 10px 4px;color:var(--dim);font-size:12px}
  .menu .ms{height:1px;background:var(--line);margin:5px 4px}
  .menu input{width:100%;padding:6px 9px;border:1px solid var(--accent);border-radius:7px;
    background:var(--field);font-size:13.5px}

  /* artboards */
  .board{position:absolute}
  .board-strip{position:absolute;left:0;bottom:100%;height:32px;display:flex;align-items:center;gap:10px;
    width:calc(100% * var(--k));transform:scale(var(--inv));transform-origin:0 100%;
    color:var(--muted);font-size:13px;user-select:none;cursor:default}
  .board-strip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 0}
  .board.selected .board-strip .nm{color:#8fb4ff}
  .board-strip .ic{display:flex;align-items:center;gap:8px;flex:none}
  .board-strip .ic button{display:flex;align-items:center;gap:4px;color:var(--muted);
    transition:color var(--t-hover) var(--ease),transform var(--t-tap) var(--ease-out)}
  .board-strip .ic button:active{transform:scale(.92)}
  .board-strip .ic .play{border:1px solid var(--line);border-radius:6px;padding:2px 7px 2px 5px;
    font-size:11px;letter-spacing:.06em}
  .board-frame{background:#fff;overflow:hidden;box-shadow:0 1px 3px rgb(0 0 0/.4)}
  .board.selected .board-frame{outline:calc(2px * var(--inv)) solid var(--accent);outline-offset:0}
  .board-frame iframe{display:block;width:100%;height:100%;border:0;background:#fff;pointer-events:none}
  .note{position:absolute;background:var(--note);color:var(--noteink);padding:12px 14px;
    font-size:12.5px;line-height:1.5;white-space:pre-wrap;cursor:grab;
    box-shadow:0 2px 8px rgb(0 0 0/.35);
    transition:box-shadow var(--t-pop) var(--ease-out)}
  .note.title{background:none;box-shadow:none;padding:0;color:var(--ink);font-size:72px;
    font-weight:700;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
  .note.dragging{cursor:grabbing;box-shadow:0 10px 26px rgb(0 0 0/.5)}
  .note.title.dragging{box-shadow:none;opacity:.8}
  .note[contenteditable=true]{outline:2px solid var(--accent);cursor:text}

  /* sidebar */
  #side{position:absolute;top:var(--head-h);right:0;bottom:0;width:var(--side-w);z-index:7;
    background:var(--head);border-left:1px solid var(--line2);
    display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);
    transition:transform 260ms var(--ease-out)}
  body.side #side{transform:none;box-shadow:-18px 0 34px rgb(0 0 0/.28)}
  #tabs{display:flex;align-items:center;gap:4px;padding:10px 10px 10px 12px;
    border-bottom:1px solid var(--line2)}
  #tabs button{color:var(--muted);font-size:14px;padding:6px 10px;border-radius:8px;
    border:1px solid transparent;transition:color var(--t-hover) var(--ease)}
  #tabs button.on{color:var(--ink);border-color:var(--accent);background:var(--panel)}
  #tabs .sp{flex:1}
  #side-x{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
  #tree{max-height:260px;min-height:80px;overflow:auto;padding:8px 0;
    border-bottom:1px solid var(--line2);resize:vertical}
  .tr{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 0;cursor:default;
    white-space:nowrap;transition:background var(--t-hover) var(--ease)}
  .tr.on{background:var(--row)}
  .tr .cv{width:14px;flex:none;display:grid;place-items:center;color:var(--dim);cursor:pointer}
  .tr .gl{width:14px;flex:none;display:grid;place-items:center;color:var(--dim)}
  .tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .tr.ab .nm{font-size:14px}
  .tr .rt{color:var(--dim);font-size:12px;flex:none}

  #props{flex:1;overflow-y:auto}
  #props .sec{border-bottom:1px solid var(--line2);padding:14px}
  #props .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #props .sh b{font-weight:500;font-size:14px}
  #props .sh .rs{color:var(--dim);font-size:13px;cursor:pointer}
  #props .g{display:flex;gap:8px;margin-bottom:8px}
  .f{flex:1;display:flex;align-items:center;gap:8px;background:var(--field);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
  .f .lb{color:var(--muted);flex:none;display:flex;align-items:center;gap:6px}
  .f .lb i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:none}
  .f.set .lb i{display:block}
  .f input{flex:1;text-align:right;font-variant-numeric:tabular-nums;
    transition:color 120ms var(--ease)}
  .f input.bad{color:#ff6b8b}
  .f .u{color:var(--dim);flex:none}
  .f .sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);flex:none;
    padding:0;overflow:hidden}
  .f select{color:var(--ink);text-align:right;flex:1;cursor:pointer}
  .seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:8px;
    padding:2px;gap:2px}
  .seg button{flex:1;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:12.5px;
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  .seg button:active{transform:scale(.96)}
  .seg button.on{background:var(--field2);color:#fff}
  .seg.ic button{display:grid;place-items:center;padding:5px 0}
  #props .add{color:var(--dim);font-size:12.5px;margin-top:2px}
  #props .add span{cursor:pointer}
  #props .empty{padding:60px 24px;text-align:center;color:var(--dim);line-height:1.7}
  #props .empty b{display:block;color:var(--muted);font-weight:400;font-size:14px;
    margin-bottom:4px}
  #props .btn{padding:6px 14px;border-radius:7px;background:var(--field2);color:var(--ink);
    border:1px solid var(--line);transition:background var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  #props .btn:active{transform:scale(.97)}
  #props .btn.ghost{background:transparent;color:var(--muted)}
  #props .btn.danger{background:transparent;color:#ff8da4;border-color:#5a2f3a}
  #props .acts{display:flex;flex-wrap:wrap;gap:8px}
  #props textarea{width:100%;background:var(--field);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;resize:vertical;
    min-height:66px}

  @media (hover:hover) and (pointer:fine){
    .pill button:hover:not(.on){background:var(--field);color:var(--ink)}
    [data-tip]:hover::after{opacity:1;transform:translateX(-50%);transition-delay:450ms}
    #doc-btn:hover{background:var(--field)}
    #t-save:hover{background:#fff}
    #tabs button:hover:not(.on){color:var(--ink)}
    #side-x:hover{background:var(--field);color:var(--ink)}
    .menu .mi:hover:not(:disabled){background:var(--field2)}
    .menu .mi .more:hover{background:var(--line);color:var(--ink)}
    .tr:hover:not(.on){background:#2a2a2a}
    .board-strip .ic button:hover{color:var(--ink)}
    .seg button:hover:not(.on){color:var(--ink)}
    #props .sh .rs:hover,#props .add span:hover{color:var(--ink)}
    #stagebar button:hover,#focusbar button:hover{background:var(--field);color:var(--ink)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
    #side,#hud{transition:none!important}
    .pill button:active,.seg button:active,.board-strip .ic button:active,#props .btn:active{transform:none}
  }

  body.view .edit-only{display:none!important}

  /* focused artboard and present mode */
  #focus{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
  #focus.on{display:flex}
  #focusbar{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;
    background:var(--head);border-bottom:1px solid var(--line2)}
  #focusbar .t{flex:1;text-align:center;color:var(--muted)}
  #focusbar button,#stagebar button{padding:6px 11px;border-radius:7px;color:var(--muted);
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  #focusbar button:active,#stagebar button:active{transform:scale(.96)}
  #focus .fwrap{flex:1;min-height:0;display:grid;place-items:center;overflow:auto}
  #focus iframe{width:100%;height:100%;border:0;background:#fff;display:block}
  body.present #focusbar{display:none}
  body.present #focus{background:#0d0d0d}
  body.present #focus .fwrap{padding:34px 34px 74px}
  body.present #focus iframe{border-radius:3px;box-shadow:0 12px 44px rgb(0 0 0/.6)}
  #stagebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;
    display:none;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgb(0 0 0/.45)}
  body.present #stagebar{display:flex}
  #slide-n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:54px;text-align:center}

  #print-out{position:absolute;left:-100000px;top:0;width:1px;height:1px;overflow:hidden}
  #print-out iframe{border:0;display:block}
  @media print{
    html,body{height:auto!important;overflow:visible!important;background:#fff!important}
    #app,#focus,#stagebar,.menu{display:none!important}
    #print-out{position:static!important;left:auto!important;width:auto!important;
      height:auto!important;overflow:visible!important}
    #print-out .p{break-after:page;break-inside:avoid}
    #print-out .p:last-child{break-after:auto}
  }
</style>
<style id="print-pages"></style>
</head>
<body>
<div id="app">
  <header id="head">
    <button id="doc-btn" aria-haspopup="menu"><span id="doc-title">__CANVAS_TITLE__</span></button>
    <span class="sp"></span>
    <button id="t-save" class="edit-only" aria-haspopup="menu"><span>Save</span></button>
  </header>
  <div id="stage">
    <div id="viewport"><div id="space"><div id="world"><svg id="ink"></svg></div></div></div>
    <div id="deny">Drop inside an artboard</div>
    <div id="toolbar" class="pill">
      <button id="page-btn" class="txt" aria-haspopup="menu"></button>
      <span class="sep"></span>
      <span id="tools" style="display:flex;gap:2px"></span>
    </div>
    <div id="hud" class="pill">
      <button id="play-btn" data-tip="Play" aria-haspopup="menu" aria-label="Play"></button>
      <button id="side-btn" class="edit-only" data-tip="Properties" aria-label="Toggle properties"></button>
      <span class="sep"></span>
      <button id="zoom-btn" class="txt" aria-haspopup="menu"></button>
    </div>
  </div>
  <aside id="side" class="edit-only">
    <div id="tabs">
      <button class="on" data-tab="edit">Properties</button>
      <button data-tab="code">Code</button>
      <button data-tab="tweaks">Tweaks</button>
      <span class="sp"></span>
      <button id="side-x" aria-label="Close panel"></button>
    </div>
    <div id="tree"></div>
    <div id="props"></div>
  </aside>
</div>
<div id="focus">
  <div id="focusbar">
    <button id="focus-close">Close</button>
    <span class="t" id="focus-title"></span>
    <button id="focus-prev" aria-label="Previous artboard">&larr;</button>
    <button id="focus-next" aria-label="Next artboard">&rarr;</button>
  </div>
  <div class="fwrap"></div>
</div>
<div id="stagebar">
  <button id="s-prev">&larr;</button><span id="slide-n"></span>
  <button id="s-next">&rarr;</button>
  <button id="s-exit">Exit</button>
</div>
<div id="print-out"></div>

<script id="canvas-doc" type="application/json">__CANVAS_STATE__</script>
<script>
(() => {
"use strict";
const raw = document.getElementById("canvas-doc").textContent;
const DOC = JSON.parse(raw.replace(/<\\\/script/g, "</scr" + "ipt").replace(/<\\!--/g, "<" + "!--"));
const files = DOC.files || {};
const manifest = DOC.canvas || {};
const boards = manifest.artboards || (manifest.artboards = []);
const notes = manifest.notes || (manifest.notes = []);
const drawings = manifest.drawings || (manifest.drawings = []);
const pages = manifest.pages || [];

const IMG=/\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i;
const MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",
  avif:"image/avif",bmp:"image/bmp",svg:"image/svg+xml"};

/* Never emit the literal "<" + "!--" or "<scr" + "ipt" inside this block: together they put the
   HTML parser into script-data-double-escaped state, the closing tag stops closing, and the
   whole script is silently never executed. */
const AGENT = "<scr" + "ipt data-dc-agent>(()=>{" + `
const P=(el)=>{const p=[];while(el&&el!==document.documentElement){const q=el.parentNode;if(!q)break;p.unshift([...q.children].indexOf(el));el=q;}return p;};
const E=(p)=>{let el=document.documentElement;for(const i of p){if(!el||!el.children[i])return null;el=el.children[i];}return el;};
let cur=null,on=false,tool=null;
const box=document.createElement('div'),hov=document.createElement('div');
const PINK='#3d7eff';
const HB='position:absolute;pointer-events:none;z-index:2147483647;box-sizing:border-box;';
const FADE='opacity:0;transition:opacity 120ms cubic-bezier(.4,0,.2,1);';
box.style.cssText=HB+FADE+'border:1.5px solid '+PINK+';';
hov.style.cssText=HB+FADE+'border:1.5px dashed '+PINK+';';
let rz=null;const HS=[];
for(const c of ['nw','ne','sw','se']){const h=document.createElement('div');
  h.dataset.c=c;
  h.style.cssText='position:absolute;width:9px;height:9px;background:#fff;box-sizing:border-box;'
    +'border:1.5px solid '+PINK+';pointer-events:none;'
    +(c[0]==='n'?'top:-5px;':'bottom:-5px;')+(c[1]==='w'?'left:-5px;':'right:-5px;');
  HS.push(h);box.append(h);}
box.dataset.dcUi='1';hov.dataset.dcUi='1';
const gh=document.createElement('div');gh.dataset.dcUi='1';
gh.style.cssText=HB+'opacity:0;transition:opacity 90ms linear;border:1.5px dashed '+PINK+';'
  +'background:rgba(61,126,255,.10);display:grid;place-items:center;color:'+PINK
  +';font:12px/1 ui-sans-serif,system-ui;letter-spacing:.02em';
const SHAPE={text:{w:90,h:24,r:'3px',t:'Text'},rect:{w:160,h:90,r:'8px',t:''},
  ellipse:{w:120,h:120,r:'50%',t:''}};
const mount=()=>document.body&&document.body.append(box,hov,gh);
if(document.body)mount();else addEventListener('DOMContentLoaded',mount);
const place=(n,el,p)=>{if(!el){n.style.opacity='0';return;}p=p||0;
  const r=el.getBoundingClientRect(),br=parseFloat(getComputedStyle(el).borderTopLeftRadius)||0;
  n.style.opacity='1';
  n.style.left=(r.left+scrollX-p)+'px';n.style.top=(r.top+scrollY-p)+'px';
  n.style.width=(r.width+p*2)+'px';n.style.height=(r.height+p*2)+'px';
  n.style.borderRadius=(br?br+p:4)+'px';};
const nameOf=(el)=>{const c=getComputedStyle(el);
  if(el.children.length===0&&el.textContent.trim())return el.textContent.trim().slice(0,26);
  if(c.display==='grid')return 'Grid';
  if(c.display==='flex'||c.display==='inline-flex')return c.flexDirection.startsWith('column')?'Column':'Row';
  return 'group';};
const tree=(el,d)=>{const r=el.getBoundingClientRect();

  if (proto.length) items.push({ head: "Prototypes" }, ...proto.map(b => ({ label: nameOf(b), on: () => focusOn(b) })));
  if (proto.length && stat.length) items.push({ sep: 1 });
  if (stat.length) items.push({ head: "Static artboards" }, ...stat.map(b => ({ label: nameOf(b), on: () => focusOn(b) })));
  if (d.length) items.push({ sep: 1 }, { label: "Present this page", kbd: "P", on: () => present(true) });
  else items.push({ label: "No artboards on this page", disabled: true });
  openMenu(playBtn, items, { right: true });
};
const docBtn = $("#doc-btn");
docBtn.insertAdjacentHTML("beforeend", ICON.chevd);
const selectedBoard = () => boards.find(b => b.file === (boardSel || (sel && sel.file)));
// The PDF choices both menus offer: this page (or the whole canvas), every page, the selection.
function pdfItems() {
  const cur = selectedBoard();
  const items = [{ head: "PDF" },
    { label: pages.length > 1 ? "This page (" + pageName() + ")" : "Whole canvas", on: () => exportPdf("page") }];
  if (pages.length > 1) items.push({ label: "All pages", on: () => exportPdf("all") });
  if (cur) items.push({ label: "Selected artboard (" + nameOf(cur) + ")", on: () => exportPdf(cur.file) });
  return items;
}
docBtn.onclick = () => {
  const cur = selectedBoard();
  const items = [];
  if (!readOnly) items.push({ label: "Save canvas", kbd: "⌘ S", on: save }, { sep: 1 });
  items.push(...pdfItems());
  if (cur) items.push({ sep: 1 }, { label: "Download " + cur.file, on: () => dl(cur.file) });
  items.push({ sep: 1 }, { label: "Present", kbd: "P", on: () => present(true) });
  openMenu(docBtn, items);
};

/* ---- focus / print / save ------------------------------------------------- */
const focusEl = $("#focus"), fwrap = focusEl.querySelector(".fwrap");
let focusFile = null;
async function focusOn(b) {
  closeMenu(); focusFile = b.file;
  await sync([b.file]);
  if (focusFile !== b.file) return;   // closed or replaced while syncing: never open late
  fwrap.textContent = "";
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts allow-forms allow-modals"); f.title = nameOf(b);
  f.srcdoc = resolve(files[b.file], false);
  fwrap.append(f); focusEl.classList.add("on");
  $("#focus-title").textContent = nameOf(b);
  const d = deck(); $("#focus-prev").hidden = $("#focus-next").hidden = d.length < 2;
}
function unfocus() { focusEl.classList.remove("on"); fwrap.textContent = ""; focusFile = null; }
function focusStep(by) {
  const d = deck(), i = d.findIndex(b => b.file === focusFile);
  if (d.length) focusOn(d[(i + by + d.length) % d.length]);
}
$("#focus-close").onclick = unfocus;
$("#focus-prev").onclick = () => focusStep(-1);
$("#focus-next").onclick = () => focusStep(1);

// Each artboard prints on its own page sized to its frame, so nothing is cropped or scaled to
// Letter. A "flow" artboard reports its full content height first and prints that tall.
const MEASURE = (i) => "<scr" + "ipt>(()=>{const s=()=>parent.postMessage({t:'ph',i:" + i +
  ",h:Math.ceil(Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0))},'*');" +
  "addEventListener('load',()=>{(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(s,80));});})()</scr" + "ipt>";
let printing = false;
async function exportPdf(scope) {
  if (printing) return; printing = true;
  const order = pages.length ? pages.map(p => p.id) : [null];
  const list = boards.filter(b => files[b.file] !== undefined && (
    scope === "all" ? true : scope === "page" ? onPage(b) : b.file === scope))
    .sort((a, b) => order.indexOf(pages.length ? pageOf(a) : null) - order.indexOf(pages.length ? pageOf(b) : null));
  if (!list.length) { printing = false; return; }
  await sync(list.map(b => b.file));
  const o = $("#print-out"); o.textContent = "";
  const css = ["@page{margin:0}"], waits = [];
  list.forEach((b, i) => {
    const w = document.createElement("div"); w.className = "p";
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts"); f.title = nameOf(b);
    f.width = b.w || 800; f.height = b.h || 600;
    waits.push(new Promise((res) => { printWaits.set(i, res);
      setTimeout(() => { if (printWaits.has(i)) { printWaits.delete(i); res(0); } }, 5000); }));
    f.srcdoc = resolve(files[b.file], false) + MEASURE(i);
    w.append(f); o.append(w);
  });
  const hs = await Promise.all(waits);
  list.forEach((b, i) => {
    const w = b.w || 800, fixed = b.h || 600;
    const h = b.print === "flow" ? Math.min(19000, Math.max(fixed, hs[i] || fixed)) : fixed;
    o.children[i].style.page = "pb" + i;
    o.children[i].firstChild.height = h;
    css.push(`@page pb${i}{size:${w}px ${h}px;margin:0}`);
  });
  $("#print-pages").textContent = css.join("\n");
  const was = document.title;
  const label = scope === "all" ? "" : scope === "page" ? (pages.length > 1 ? " - " + pageName() : "")
    : " - " + nameOf(list[0]);
  document.title = (DOC.title || was) + label;   // the browser names the PDF after the title
  const done = () => { document.title = was; printing = false; removeEventListener("afterprint", done); };
  addEventListener("afterprint", done);
  print();
  setTimeout(() => { if (printing) done(); }, 1500);
}
const askHtml = (f) => new Promise((res) => {
  const id = ++seq; pend.set(id, res); tellAgent(f, { t: "serialize", id });
  setTimeout(() => { if (pend.has(id)) { pend.delete(id); res(null); } }, 3000);
});
async function save() {
  if (readOnly) return;
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();   // commit a note or field mid-edit
  const btn = $("#t-save"), lbl = btn.querySelector("span");
  lbl.textContent = "Saving…"; btn.disabled = true;
  try {
    await sync();
    const live = new Set(boards.map(b => b.file));
    const out = {};
    for (const [k, v] of Object.entries(files)) if (!/\.html$/i.test(k) || live.has(k)) out[k] = v;
    const state = JSON.stringify({ title: DOC.title, mode: DOC.mode, files: out, canvas: manifest })
      .replace(/<\/script/gi, "<\\/script").replace(/<!\x2D\x2D/g, "<\\!--");
    const c = document.documentElement.cloneNode(true);
    c.querySelector("#world").innerHTML = '<svg id="ink"></svg>';
    c.querySelector("#print-out").textContent = "";
    c.querySelector("#print-pages").textContent = "";
    c.querySelector(".fwrap").textContent = "";
    c.querySelector("#focus").classList.remove("on");
    for (const s of ["#tools", "#tree", "#props", "#zoom-btn", "#play-btn", "#page-btn", "#side-btn", "#side-x"])
      c.querySelector(s).textContent = "";
    c.querySelector("#doc-btn").innerHTML = c.querySelector("#doc-btn").querySelector("span").outerHTML;
    c.querySelectorAll(".menu").forEach(n => n.remove());
    c.querySelector("body").className = "";
    const sv = c.querySelector("#t-save"); sv.removeAttribute("disabled"); sv.innerHTML = "<span>Save</span>";
    c.querySelector("#tree").removeAttribute("style"); c.querySelector("#side-btn").classList.remove("on");
    c.querySelectorAll("#tabs button[data-tab]").forEach(t => t.classList.toggle("on", t.dataset.tab === "edit"));
    c.querySelector("#canvas-doc").textContent = state;
    const blob = new Blob(["<!doct" + "ype html>\n" + c.outerHTML], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (DOC.title || "canvas").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".html";
    a.click(); URL.revokeObjectURL(a.href);
    lbl.textContent = "Saved";
  } catch (err) { lbl.textContent = "Failed"; console.error(err); }
  setTimeout(() => { lbl.textContent = "Save"; btn.disabled = false; }, 1300);
}
// Save asks for the format: the editable HTML canvas (also ⌘ S) or a PDF.
const saveBtn = $("#t-save");
saveBtn.insertAdjacentHTML("beforeend", ICON.chevd);
saveBtn.onclick = () => openMenu(saveBtn, [
  { head: "HTML" }, { label: "Editable canvas", kbd: "⌘ S", on: save },
  { sep: 1 }, ...pdfItems(),
], { right: true });

/* ---- sidebar -------------------------------------------------------------- */
const sideBtn = $("#side-btn");
sideBtn.innerHTML = ICON.side; $("#side-x").innerHTML = ICON.x;
function showSide(on, remember) {
  if (readOnly) return;
  if (remember) try { localStorage.setItem("designboard.side", on ? "1" : "0"); } catch {}
  const was = document.body.classList.contains("side");
  if (was === on) return;
  document.body.classList.toggle("side", on); sideBtn.classList.toggle("on", on);
}
sideBtn.onclick = () => showSide(!document.body.classList.contains("side"), true);
$("#side-x").onclick = () => showSide(false, true);
$("#tabs").onclick = (e) => { const b = e.target.closest("button[data-tab]"); if (!b) return;
  $("#tabs").querySelectorAll("button[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  const t = tab = b.dataset.tab;
  treeEl.style.display = t === "edit" ? "" : "none";
  if (t === "edit") drawProps();
  else if (t === "code") drawCode();
  else drawTweaks();
};

function pickFile() { return boardSel || (sel && sel.file) || boards.filter(onPage)[0]?.file; }
function note(msg) { propsEl.textContent = "";
  const e = document.createElement("div"); e.className = "empty"; e.innerHTML = msg;
  propsEl.append(e); }

function drawCode() {
  const file = pickFile();
  if (!file) return note("<b>Code</b>Select an artboard first.");
  const f = frames.get(file);
  propsEl.textContent = "";
  const sec = section(stem(file));
  const ta = document.createElement("textarea");
  ta.style.cssText = "min-height:52vh;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace";
  ta.spellcheck = false; ta.value = files[file];
  const bar = document.createElement("div"); bar.className = "g"; bar.style.marginTop = "8px";
  const ap = document.createElement("button");
  ap.className = "btn"; ap.textContent = "Apply";
  ap.onclick = () => { if (ta.value === files[file]) return;
    const prev = files[file]; files[file] = ta.value; _rcache.clear(); render(); askTree(file);
    record({ kind: "src", file, prev, next: ta.value });
    ap.textContent = "Applied"; setTimeout(() => ap.textContent = "Apply", 1100); };
  const rev = document.createElement("button");
  rev.className = "btn ghost"; rev.textContent = "Revert";
  rev.onclick = () => { ta.value = files[file]; };
  bar.append(ap, rev);
  sec.append(ta, bar); propsEl.append(sec);
  if (f) { const id = ++seq; pend.set(id, (html) => { if (html) { ta.value = html; } });
    tellAgent(f, { t: "src", id }); }
}

function drawTweaks() {
  const file = pickFile();
  if (!file) return note("<b>Tweaks</b>Select an artboard first.");
  const f = frames.get(file);
  if (!f) return note("<b>Tweaks</b>Artboard is not loaded.");
  const id = ++seq;
  pend.set(id, (vars) => {
    const keys = Object.keys(vars || {}).sort();
    if (!keys.length) return note("<b>No design tokens</b>This artboard defines no CSS custom "
      + "properties on :root, html or body.");
    propsEl.textContent = "";
    const sec = section("Design tokens", () => { for (const k of keys)
      tellAgent(f, { t: "setvar", name: k, value: "" }); setTimeout(() => drawTweaks(), 120); });
    for (const k of keys) {
      const v = vars[k];
      const isColor = /^#|^rgb|^hsl|^oklch/i.test(v);
      sec.append(grp(fld({ label: k.replace(/^--/, ""), value: isColor ? v.toUpperCase() : v,
        prop: k, kind: isColor ? "color" : "text", set: true,
        onSet: (nv) => tellAgent(f, { t: "setvar", name: k, value: nv }) })));
    }
    propsEl.append(sec);
  });
  tellAgent(f, { t: "vars", id });
}

/* ---- present mode --------------------------------------------------------- */
let slide = -1;
const deck = () => boards.filter(b => onPage(b) && files[b.file] !== undefined);
function showSlide(i) {
  const d = deck(); if (!d.length) return;
  slide = (i + d.length) % d.length;
  const b = d[slide];
  fwrap.textContent = "";
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts"); f.title = nameOf(b);
  f.srcdoc = resolve(files[b.file], false);
  const pad = 68, maxW = innerWidth - pad, maxH = innerHeight - pad - 40;
  const k = Math.min(maxW / (b.w || 800), maxH / (b.h || 600), 1.6);
  f.style.width = Math.round((b.w || 800) * k) + "px";
  f.style.height = Math.round((b.h || 600) * k) + "px";
  fwrap.append(f);
  $("#slide-n").textContent = (slide + 1) + " / " + d.length;
}
async function present(on) {
  closeMenu();
  if (on) await sync(deck().map(b => b.file));
  document.body.classList.toggle("present", on);
  focusEl.classList.toggle("on", on);
  if (on) { showSlide(slide < 0 ? 0 : slide); }
  else { slide = -1; fwrap.textContent = ""; }
}
$("#s-next").onclick = () => showSlide(slide + 1);
$("#s-prev").onclick = () => showSlide(slide - 1);
$("#s-exit").onclick = () => present(false);
addEventListener("resize", () => { if (isPresent()) showSlide(slide); });
addEventListener("keydown", (e) => {
  if (!isPresent()) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
    e.preventDefault(); showSlide(slide + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); showSlide(slide - 1); }
  else if (e.key === "Escape") present(false);
}, true);

/* ---- boot ----------------------------------------------------------------- */
if (readOnly) { document.body.classList.add("view"); $("#t-save").remove(); }
const launch = manifest.launch || { view: "canvas" };
page = pages.length ? (pages.some(p => p.id === launch.page) ? launch.page : pages[0].id) : null;
paintPageBtn();
let sidePref = null; try { sidePref = localStorage.getItem("designboard.side"); } catch {}
showSide(sidePref !== "0");                     // the panel starts open unless it was closed here
setMode("select");
render(); paintInk(); drawTree(); drawProps();
if (launch.view === "focused" && files[launch.file])
  focusOn(boards.find(b => b.file === launch.file) || { file: launch.file });
fit();
})();
</script>
</body>
